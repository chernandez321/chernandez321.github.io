<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>404 Not Found</title>
  </head>
  <body>
    <script>
      // SPA fallback for GitHub Pages: load index.html while preserving the URL
      (function () {
        var path = location.pathname + location.search + location.hash;
        fetch('/index.html')
          .then(function (r) { return r.text(); })
          .then(function (html) {
            document.open();
            document.write(html);
            // ensure client router sees the original path
            history.replaceState({}, '', path);
          })
          .catch(function () {
            // if index can't be loaded, redirect to root
            location.replace('/');
          });
      })();
    </script>
  </body>
</html>
